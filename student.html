<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學生入口 · 實務專題系統</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
<link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#EEF2F5;
  --surface:#FFFFFF;
  --ink:#10222E;
  --muted:#5E6E79;
  --line:#D5DEE4;
  --primary:#15455E;
  --accent:#2E8B84;
  --gold:#C9822E;
  --danger:#B4453A;
  --primary-soft:#E4ECF0;
  --accent-soft:#E1F0EE;
  --gold-soft:#F7EBD8;
  --radius:12px;
  --shadow:0 1px 2px rgba(16,34,46,.05),0 8px 24px rgba(16,34,46,.06);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC",system-ui,sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}
.topbar{background:var(--primary);color:#fff;padding:14px 0}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .t{font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px}
.topbar .r{display:flex;align-items:center;gap:14px;font-size:13px}
.topbar a{color:#cfe0e8;text-decoration:none}
.topbar a:hover{color:#fff}
.link-btn{background:none;border:0;color:#cfe0e8;font:inherit;cursor:pointer;padding:0}
.link-btn:hover{color:#fff}
.center{min-height:74vh;display:grid;place-items:center;padding:40px 0}
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  width:100%;
  max-width:420px;
  padding:28px;
}
.card h1{font-family:"Noto Serif TC",serif;font-size:22px;margin:0 0 16px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tab{
  flex:1;
  text-align:center;
  padding:8px;
  border-radius:9px;
  font-size:14px;
  font-weight:500;
  color:var(--muted);
  cursor:pointer;
  border:1px solid transparent;
}
.tab.on{color:var(--primary);background:var(--primary-soft);border-color:var(--line)}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=email],input[type=password]{
  width:100%;
  font:inherit;
  font-size:14px;
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:9px;
  padding:9px 11px;
  transition:.15s;
}
input:disabled{background:#f2f5f7;color:#40525d}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:10px 16px;
  border-radius:9px;
  font:inherit;
  font-size:14px;
  font-weight:500;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  transition:.15s;
  text-decoration:none;
}
.btn:hover{border-color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#0e364a}
.btn-block{width:100%;margin-top:18px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--accent)}
.hidden{display:none!important}
main{padding:28px 0 60px}
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:22px 24px;
  margin-bottom:20px;
}
.panel-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.panel-head h2{font-family:"Noto Serif TC",serif;font-size:19px;margin:0}
.panel-head .hint{font-size:12px;color:var(--muted)}
.prow{display:grid;grid-template-columns:76px 1fr 1fr;gap:12px;align-items:end;margin-bottom:6px}
.prow .prole{font-size:13px;font-weight:700;color:var(--primary);padding-bottom:9px}
.prow.head label{margin-top:0}
.req{color:var(--danger)}
.lock-note{
  background:var(--gold-soft);
  color:#8a5a1c;
  border-radius:9px;
  padding:10px 14px;
  font-size:13px;
  margin-bottom:6px;
}
.advisor-box{display:flex;align-items:center;gap:12px;font-size:15px;flex-wrap:wrap}
.advisor-name{font-weight:700}
.pill{
  font-size:12px;
  font-weight:500;
  padding:3px 11px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent);
}
.pill.wait{background:#eef1f3;color:var(--muted)}
.round{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;background:#fafcfd}
.round-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.round-no{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--primary);font-weight:500}
.round-title{font-weight:700;font-size:15px}
.round-desc{font-size:13px;color:var(--muted);margin:0 0 12px}
.round-locked{font-size:13px;color:var(--muted)}
.rules-embed{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fafcfd}
.rules-embed iframe{width:100%;height:560px;border:0;display:block}
.rules-embed img{width:100%;display:block}
.rules-none{color:var(--muted);font-size:14px}
.slot{
  display:grid;
  grid-template-columns:150px 1fr auto;
  gap:12px;
  align-items:center;
  padding:10px 0;
  border-top:1px solid var(--line);
}
.slot:first-child{border-top:0}
.slot .slot-label{font-size:14px;font-weight:500}
.slot .slot-label .req{color:var(--danger)}
.slot .slot-hint{font-size:12px;color:var(--muted);font-weight:400}
.slot .slot-state{font-size:13px;min-width:0;overflow:hidden}
.slot .fname{
  font-family:"IBM Plex Mono",monospace;
  font-size:12px;
  color:var(--ink);
  word-break:break-all;
}
.slot .fnone{color:var(--muted);font-size:13px}
.slot .slot-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.slot input[type=file]{display:none}
.slot .prog{font-size:12px;color:var(--accent)}
.slot .lnk{font-size:13px;color:var(--primary);text-decoration:underline;cursor:pointer}
.slot .btn-file{padding:7px 12px;font-size:13px}
.tabs{display:flex;gap:6px;margin:22px 0 0;border-bottom:1px solid var(--line)}
.tab{
  padding:10px 18px;
  font-size:15px;
  font-weight:500;
  color:var(--muted);
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.tchip{
  font-size:11px;
  font-weight:500;
  border-radius:999px;
  padding:1px 8px;
  margin-left:6px;
  vertical-align:middle;
}
.tchip.open{background:var(--accent-soft);color:var(--accent)}
.tchip.notyet{background:#e7ebee;color:#5e6e79}
.tchip.closed{background:#f6e2df;color:#8a3320}
.tchip.limited{background:#eef1f3;color:#5e6e79}
.round-h{font-family:"Noto Serif TC",serif;font-size:18px;margin:0 0 4px}
.round-sec{margin-top:18px}
.round-sec:first-of-type{margin-top:10px}
.round-sub{
  font-size:13px;
  font-weight:500;
  color:var(--muted);
  margin:0 0 10px;
  padding-bottom:6px;
  border-bottom:1px solid var(--line);
}
.round-locked.closed{background:#f6e2df;color:#8a3320}
.statusbar{border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;margin:0 0 14px}
.statusbar.sb-open{background:var(--accent-soft);color:var(--accent)}
.statusbar.sb-notyet{background:#e7ebee;color:#5e6e79}
.statusbar.sb-closed{background:#f6e2df;color:#8a3320}
.statusbar.sb-limited{background:#eef1f3;color:#5e6e79}

#__np{
  position:fixed;
  top:0;
  left:0;
  height:4px;
  width:0;
  background:var(--accent);
  z-index:99999;
  opacity:0;
  transition:width .25s ease,opacity .3s;
}
#__np.on{opacity:1}
#__toast{
  position:fixed;
  left:50%;
  bottom:26px;
  transform:translateX(-50%) translateY(14px);
  background:#10222E;
  color:#fff;
  padding:11px 20px;
  border-radius:999px;
  font-size:14px;
  font-weight:500;
  z-index:99999;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
  box-shadow:0 8px 24px rgba(0,0,0,.28);
  display:flex;
  align-items:center;
  gap:10px;
}
#__toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#__toast .s{
  width:15px;
  height:15px;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  border-radius:50%;
  animation:__spin .6s linear infinite;
  flex:0 0 auto;
}
.btn-loading{position:relative;pointer-events:none;opacity:.7}
.btn-loading::before{
  content:"";
  display:inline-block;
  width:12px;
  height:12px;
  border:2px solid currentColor;
  border-top-color:transparent;
  border-radius:50%;
  animation:__spin .6s linear infinite;
  margin-right:7px;
  vertical-align:-1px;
}
@keyframes __spin{to{transform:rotate(360deg)}}
.topbar,.site-header{position:sticky;top:0;z-index:50}
#toTop{
  position:fixed;
  right:18px;
  bottom:20px;
  width:44px;
  height:44px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--surface);
  color:var(--primary);
  box-shadow:0 4px 14px rgba(16,34,46,.18);
  cursor:pointer;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:22px;
  line-height:1;
  z-index:60;
  padding:0;
}
#toTop.show{display:flex}
#toTop:hover{border-color:var(--primary)}
input,select,textarea{max-width:100%;min-width:0}
html,body{overflow-x:hidden}

@media(max-width:640px){
  .wrap{padding-left:16px;padding-right:16px}
  .prow,.slot{grid-template-columns:1fr}
  .prow .prole{padding-bottom:0}
  .slot{gap:6px}
  .slot .slot-act{justify-content:flex-start}
  input[type=text],input[type=email],input[type=password],
  input[type=number],select,textarea{font-size:16px}
  .tabs{
    overflow-x:auto;
    flex-wrap:nowrap;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;flex:0 0 auto}
  .topbar .wrap{flex-wrap:wrap;row-gap:4px}
  .topbar .t{font-size:15px}
  .topbar .r{font-size:12px;gap:10px}
  .panel,.card{padding-left:16px;padding-right:16px}
  .prow>*,.slot>*{min-width:0}
}
</style>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#15455E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="實務專題">
</head>

<body>
<div class="topbar">
  <div class="wrap">
    <span class="t">學生入口</span>
    <div class="r" id="topRight"><a href="index.html">回首頁</a></div>
  </div>
</div>

<div id="bootView" class="center">
  <div class="card" style="text-align:center;color:var(--muted)">載入中…</div>
</div>

<div id="authView" class="center hidden">
  <div class="card">
    <div class="tabs">
      <div class="tab on" id="tabLogin">登入</div>
      <div class="tab" id="tabReg">註冊（組長）</div>
    </div>

    <div id="loginForm">
      <h1 style="font-size:19px;margin:14px 0 0">組長登入</h1>
      <label for="lEmail">電子郵件</label>
      <input id="lEmail" type="email" autocomplete="username">
      <label for="lPw">密碼</label>
      <input id="lPw" type="password" autocomplete="current-password">
      <button class="btn btn-primary btn-block" id="loginBtn">登入</button>
      <div style="text-align:right;margin-top:8px">
        <a href="#" id="forgotPw" style="font-size:13px;color:var(--primary)">忘記密碼？</a>
      </div>
      <div class="msg err" id="loginMsg"></div>
    </div>

    <div id="regForm" class="hidden">
      <h1 style="font-size:19px;margin:14px 0 0">組長註冊</h1>
      <p style="font-size:12px;color:var(--muted);margin:6px 0 0">
        每組僅需組長一人註冊，用於登錄分組名單與上傳。
      </p>
      <label for="rEmail">電子郵件</label>
      <input id="rEmail" type="email" autocomplete="username">
      <label for="rPw">設定密碼（至少 6 碼）</label>
      <input id="rPw" type="password" autocomplete="new-password">
      <button class="btn btn-primary btn-block" id="regBtn">建立帳號</button>
      <div class="msg err" id="regMsg"></div>
    </div>
  </div>
</div>

<main id="studentView" class="wrap hidden">
  <section class="panel">
    <div class="panel-head">
      <h2>分組名單</h2>
      <span class="hint" id="groupState"></span>
    </div>

    <div id="lockNote" class="lock-note hidden">
      分組名單已送出，無法自行修改。如需更正，請洽系辦。
    </div>

    <div class="prow head">
      <div class="prole">組長 <span class="req">*</span></div>
      <div><label>學號</label><input id="leaderSid" type="text"></div>
      <div><label>姓名</label><input id="leaderName" type="text"></div>
    </div>

    <div class="prow">
      <div class="prole">組員1 <span class="req">*</span></div>
      <div><input id="m1Sid" type="text" placeholder="學號"></div>
      <div><input id="m1Name" type="text" placeholder="姓名"></div>
    </div>

    <div class="prow">
      <div class="prole">組員2 <span class="req">*</span></div>
      <div><input id="m2Sid" type="text" placeholder="學號"></div>
      <div><input id="m2Name" type="text" placeholder="姓名"></div>
    </div>

    <div class="prow">
      <div class="prole">組員3</div>
      <div><input id="m3Sid" type="text" placeholder="學號（選填）"></div>
      <div><input id="m3Name" type="text" placeholder="姓名（選填）"></div>
    </div>

    <div id="saveArea">
      <button class="btn btn-primary" id="saveGroup" style="margin-top:16px">
        送出分組名單
      </button>
      <span class="msg err" id="groupMsg"></span>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>指導老師</h2></div>
    <div class="advisor-box" id="advisorBox"></div>
  </section>

  <div class="tabs hidden" id="upTabs">
    <div class="tab on" data-r="r1">
      第一次上傳<span class="tchip" data-chip="r1"></span>
    </div>
    <div class="tab" data-r="r2">
      第二次上傳<span class="tchip" data-chip="r2"></span>
    </div>
    <div class="tab" data-r="r3">
      第三次上傳<span class="tchip" data-chip="r3"></span>
    </div>
  </div>

  <section class="panel hidden" id="uploadSection"
    style="border-top-left-radius:0;border-top-right-radius:0">
    <div id="roundHost"></div>
  </section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const $=(s,el=document)=>el.querySelector(s);

const esc=t=>String(t??"").replace(
  /[&<>"]/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;"
  }[c])
);

function safeUrl(u){
  u=String(u==null?"":u);
  return /^https?:\/\//i.test(u)?u:"#";
}

function notPast(iso){
  if(!iso)return true;
  const t=new Date(iso).getTime();
  return isNaN(t)||Date.now()<t;
}

function afterStart(iso){
  if(!iso)return true;
  const t=new Date(iso).getTime();
  return isNaN(t)||Date.now()>=t;
}

function fmtWhen(iso){
  if(!iso)return "";

  const d=new Date(iso);
  if(isNaN(d))return "";

  const p=x=>String(x).padStart(2,"0");

  return d.getFullYear()+"/"+
    p(d.getMonth()+1)+"/"+
    p(d.getDate())+" "+
    p(d.getHours())+":"+
    p(d.getMinutes());
}

function flash(id,msg,ok=true){
  const e=$("#"+id);
  if(!e)return;

  e.textContent=msg;
  e.className="msg "+(ok?"ok":"err");

  if(ok&&msg){
    setTimeout(()=>{
      if(e.textContent===msg)e.textContent="";
    },2600);
  }
}

if(typeof firebase==="undefined"||!firebase.apps.length){
  $("#loginMsg").textContent=
    "尚未設定 Firebase（請先填好 firebase-config.js）。";
  $("#bootView").classList.add("hidden");
  $("#authView").classList.remove("hidden");
}

const auth=firebase.auth();
const db=firebase.firestore();
const storage=firebase.storage();

try{
  db.enablePersistence({synchronizeTabs:true}).catch(function(){});
}catch(_){}

const ROSTER_IDS=[
  "leaderSid","leaderName",
  "m1Sid","m1Name",
  "m2Sid","m2Name",
  "m3Sid","m3Name"
];

let myFiles={};
let myTopic="";
let topicDraft=null;
let topicSaving=false;
let studentUploads=0;
let renderVersion=0;
let liveUnsubscribers=[];

let myGroupNo="";
let mySubmitted={};
let myLeaderSid="";
let myLeaderName="";
let curR="r1";
let myCohort="current";
let hasGroup=false;

$("#tabLogin").onclick=()=>{
  $("#tabLogin").classList.add("on");
  $("#tabReg").classList.remove("on");
  $("#loginForm").classList.remove("hidden");
  $("#regForm").classList.add("hidden");
};

$("#tabReg").onclick=()=>{
  $("#tabReg").classList.add("on");
  $("#tabLogin").classList.remove("on");
  $("#regForm").classList.remove("hidden");
  $("#loginForm").classList.add("hidden");
};

auth.onAuthStateChanged(async user=>{
  stopLiveStudent();

  myFiles={};
  myTopic="";
  topicDraft=null;

  $("#roundHost").replaceChildren();
  delete $("#roundHost").dataset.owner;
  renderVersion++;

  if(!user){
    $("#topRight").innerHTML='<a href="index.html">回首頁</a>';
    $("#bootView").classList.add("hidden");
    $("#authView").classList.remove("hidden");
    $("#studentView").classList.add("hidden");
    return;
  }

  try{
    const u=await db.doc("users/"+user.uid).get();

    if(!u.exists||u.data().role!=="student"){
      flash("loginMsg","此入口供學生（組長）使用。",false);
      await auth.signOut();
      return;
    }

    $("#topRight").innerHTML=
      '<a href="index.html">回首頁</a>'+
      '<button class="link-btn" id="signOut">登出（'+
      esc(user.email)+'）</button>';

    $("#signOut").onclick=()=>auth.signOut();

    $("#bootView").classList.add("hidden");
    $("#authView").classList.add("hidden");
    $("#studentView").classList.remove("hidden");

    await loadGroup(user);
    await renderRound();
    subscribeLiveStudent(user.uid);
  }catch(e){
    flash("loginMsg","載入失敗："+(e.code||e.message),false);
  }
});

$("#loginBtn").onclick=()=>{
  const em=$("#lEmail").value.trim();
  const pw=$("#lPw").value;

  if(!em||!pw){
    flash("loginMsg","請輸入電子郵件與密碼。",false);
    return;
  }

  const btn=$("#loginBtn");
  btn.disabled=true;
  btn.textContent="登入中…";

  auth.signInWithEmailAndPassword(em,pw)
    .catch(e=>{
      flash("loginMsg","登入失敗："+(e.code||e.message),false);
    })
    .finally(()=>{

$("#regBtn").onclick=async()=>{
  const em=$("#rEmail").value.trim();
  const pw=$("#rPw").value;

  if(!em||!pw){
    flash("regMsg","請填寫電子郵件與密碼。",false);
    return;
  }

  $("#regBtn").disabled=true;
  $("#regBtn").textContent="建立中…";

  try{
    const reg=await db.doc("settings/registration").get();
    const rd=reg.exists?reg.data():{};

    if(rd.open!==true){
      flash("regMsg","目前未開放分組登錄。",false);
      return;
    }

    if(!afterStart(rd.regStart)){
      flash(
        "regMsg",
        "分組登錄尚未開始（開始時間："+fmtWhen(rd.regStart)+"）。",
        false
      );
      return;
    }

    if(!notPast(rd.regDeadline)){

        "regMsg",
        "分組登錄已截止（截止時間："+fmtWhen(rd.regDeadline)+"）。",
        false
      );
      return;
    }

    const cred=await auth.createUserWithEmailAndPassword(em,pw);

    try{
      await db.doc("users/"+cred.user.uid).set({
        role:"student",
        email:em
      });
    }catch(writeError){
      try{

$("#saveGroup").onclick=async()=>{
  const user=auth.currentUser;
  if(!user)return;

  const value=id=>$("#"+id).value.trim();

  const required=[
    ["leaderSid","組長學號"],
    ["leaderName","組長姓名"],
    ["m1Sid","組員1學號"],
    ["m1Name","組員1姓名"],
    ["m2Sid","組員2學號"],
    ["m2Name","組員2姓名"]
  ];

  for(const [id,label]of required){
    if(!value(id)){
      flash("groupMsg","請填寫必填欄位："+label+"。",false);
      return;
    }
  }

  if(
    (value("m3Sid")&&!value("m3Name"))||
    (!value("m3Sid")&&value("m3Name"))
  ){
    flash(
      "groupMsg",
      "組員3 需同時填學號與姓名，或兩者留空。",
      false
    );
    return;
  }

  const members=[
    {sid:value("m1Sid"),name:value("m1Name")},
    {sid:value("m2Sid"),name:value("m2Name")}
  ];

  if(value("m3Sid")&&value("m3Name")){
    members.push({
      sid:value("m3Sid"),
      name:value("m3Name")
    });
  }

  if(!confirm(
    "分組名單送出後將無法自行修改，如需更正須洽系辦。確定送出？"
  ))return;

  $("#saveGroup").disabled=true;

  try{
    let nextCohort=false;

    try{
      const reg=await db.doc("settings/registration").get();
      if(reg.exists)nextCohort=reg.data().nextCohort===true;
    }catch(_){}

    myCohort=nextCohort?"next":"current";

    await db.doc("groups/"+user.uid).set({
      leaderUid:user.uid,
      leaderSid:value("leaderSid"),
      leaderName:value("leaderName"),
      members:members,
      cohort:myCohort,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

    hasGroup=true;
    setRosterDisabled(true);
    flash("groupMsg","已送出。",true);

    await renderRound();
  }catch(e){
    flash("groupMsg","送出失敗："+(e.code||e.message),false);
    $("#saveGroup").disabled=false;
  }
};

function stopLiveStudent(){
  liveUnsubscribers.forEach(unsubscribe=>unsubscribe());
  liveUnsubscribers=[];
}

function subscribeLiveStudent(uid){
  stopLiveStudent();

  const listen=(path,apply)=>{
    liveUnsubscribers.push(
      db.doc(path).onSnapshot(
        doc=>{
          if(auth.currentUser?.uid!==uid)return;
          apply(doc);
          renderRound();
        },
        err=>{
          showUploadNotice(
            "資料同步失敗："+(err.code||err.message),
            false
          );
        }
      )
    );
  };

  listen("groups/"+uid,doc=>{
    if(!doc.exists){
      hasGroup=false;
      return;
    }

    const g=doc.data();

    hasGroup=true;
    myTopic=g.topic||"";
    myGroupNo=g.groupNo||"";
    myLeaderSid=g.leaderSid||"";
    myLeaderName=g.leaderName||"";
    myCohort=g.cohort==="next"?"next":"current";

    renderAdvisor(g.advisorName||"");
  });

  listen("settings/uploads",()=>{});
  listen("settings/finalists",()=>{});

  listen("groupFiles/"+uid,doc=>{
    myFiles=doc.exists?doc.data():{};
  });
}

function roundDone(rk){
  const def=ROUND_DEFS[rk];
  const record=myFiles[rk]||{};

  return (rk!=="r1"||!!myTopic.trim())&&
    def.slots
      .filter(slot=>slot.required)
      .every(slot=>record[slot.key]&&record[slot.key].url);
}

function rulesFiles(up,n){
  const key="rules"+n;

  if(Array.isArray(up[key+"Files"])){
    return up[key+"Files"];
  }

  return up[key+"Url"]?[{
    id:"legacy",
    url:up[key+"Url"],
    path:up[key+"Path"]||"",
    name:up[key+"Name"]||"規定文件",
    type:up[key+"Type"]||"pdf"
  }]:[];
}

function rulesEmbed(url,type){
  if(!url){
    return '<p class="rules-none">系辦尚未上傳本次規定文件。</p>';
  }

  if(type==="image"){
    return '<div class="rules-embed">'+
      '<img src="'+esc(safeUrl(url))+'" alt="專題規定">'+
      '</div>';
  }

  return '<div class="rules-embed">'+
    '<iframe src="'+esc(safeUrl(url))+
    '#toolbar=1" title="專題規定"></iframe></div>'+
    '<p style="font-size:12px;color:var(--muted);margin:8px 0 0">'+
    '若下方無法顯示，可 <a href="'+esc(safeUrl(url))+
    '" target="_blank" rel="noopener" style="color:var(--primary)">'+
    '另開新分頁檢視</a>。</p>';
}

function buildUploadPanels(uid){
  const host=$("#roundHost");
  if(host.dataset.owner===uid)return;

  host.innerHTML=
    '<div id="uploadNotice" class="msg" role="status" aria-live="polite"></div>'+
    Object.entries(ROUND_DEFS).map(([rk,def])=>
      '<div data-round-panel="'+rk+'" class="hidden">'+
        '<h2 class="round-h">'+
          esc(def.no)+'　'+esc(def.title)+
          ' <span data-complete></span>'+
        '</h2>'+
        '<div class="statusbar" data-status></div>'+
        (rk==="r1"?topicHtml(true):"")+
        '<div class="round-sec">'+
          '<div class="round-sub">規定／注意事項</div>'+
          '<div data-rules></div>'+
        '</div>'+
        '<div class="round-sec">'+
          '<div class="round-sub">檔案上傳（單檔小於 50MB）</div>'+
          def.slots.map(slot=>
            '<div class="slot" data-round="'+rk+
            '" data-slot="'+slot.key+'">'+
              '<div class="slot-label">'+
                esc(slot.label)+
                (slot.required?' <span class="req">*</span>':"")+
                '<div class="slot-hint">'+esc(slot.hint)+'</div>'+
              '</div>'+
              '<div class="slot-state">'+
                '<div data-file-state></div>'+
                '<span class="prog" role="status"></span>'+
              '</div>'+
              '<div class="slot-act">'+
                '<span class="lnk hidden" data-act="view">檢視</span>'+
                '<label class="btn btn-file">'+
                  '<input type="file" accept="'+
                  esc(slot.accept)+'" data-act="pick">'+
                  '<span data-pick-label>上傳</span>'+
                '</label>'+
              '</div>'+
            '</div>'
          ).join("")+
        '</div>'+
      '</div>'
    ).join("");

  host.dataset.owner=uid;
}

async function renderRound(){
  const version=++renderVersion;
  const uid=auth.currentUser?.uid;

  if(!uid)return;

  if(!hasGroup||myCohort==="next"){
    $("#upTabs").classList.add("hidden");
    $("#uploadSection").classList.add("hidden");
    return;
  }

  $("#upTabs").classList.remove("hidden");
  $("#uploadSection").classList.remove("hidden");

  buildUploadPanels(uid);

  try{
    const [upDoc,finDoc]=await Promise.all([
      db.doc("settings/uploads").get(),
      db.doc("settings/finalists").get()
    ]);

    if(
      version!==renderVersion||
      auth.currentUser?.uid!==uid
    )return;

    const up=upDoc.exists?upDoc.data():{};
    const fin=finDoc.exists?finDoc.data():{};

    const finalist=
      !!fin.published&&
      Array.isArray(fin.groups)&&
      fin.groups.some(group=>
        group.no===myGroupNo&&!!myGroupNo
      );

    const chipMap={
      open:["開放中","open"],
      notyet:["未開放","notyet"],
      notstarted:["未開始","notyet"],
      closed:["已截止","closed"],
      limited:["限入選","limited"]
    };

    Object.keys(ROUND_DEFS).forEach(rk=>{
      const n=rk.slice(1);

      const state=
        rk==="r2"&&!finalist
          ?"limited"
          :!up["round"+n+"Open"]
          ?"notyet"
          :!afterStart(up["round"+n+"Start"])
          ?"notstarted"
          :!notPast(up["round"+n+"Deadline"])
          ?"closed"
          :"open";

      const [label,cls]=chipMap[state];

      const panel=document.querySelector(
        '[data-round-panel="'+rk+'"]'
      );

      panel.classList.toggle("hidden",rk!==curR);

      const chip=document.querySelector(
        '[data-chip="'+rk+'"]'
      );

      chip.textContent=label;
      chip.className="tchip "+cls;

      const status=$("[data-status]",panel);

      status.className="statusbar sb-"+(
        state==="open"
          ?"open"
          :state==="closed"
          ?"closed"
          :state==="limited"
          ?"limited"
          :"notyet"
      );

      status.textContent=label+(
        up["round"+n+"Deadline"]
          ?"（截止時間 "+fmtWhen(up["round"+n+"Deadline"])+"）"
          :""
      );

      $("[data-complete]",panel).textContent=
        roundDone(rk)?"✓ 已完成":"";

      const ruleHtml=rulesFiles(up,n).map(file=>
        '<div style="margin-bottom:20px">'+
          '<p><a href="'+esc(safeUrl(file.url))+
          '" target="_blank" rel="noopener">'+
          esc(file.name||"規定文件")+'</a></p>'+
          rulesEmbed(file.url,file.type)+
        '</div>'
      ).join("")||rulesEmbed("","");

      const ruleHost=$("[data-rules]",panel);

      if(ruleHost.__html!==ruleHtml){
        ruleHost.innerHTML=ruleHtml;
        ruleHost.__html=ruleHtml;
      }

      document.querySelectorAll(
        '[data-round-panel="'+rk+'"] input[type=file], '+
        '[data-round-panel="'+rk+'"] [data-act="save-topic"], '+
        '[data-round-panel="'+rk+'"] #projectTopic'
      ).forEach(el=>{
        el.dataset.allowed=String(state==="open");
        el.disabled=
          state!=="open"||
          studentUploads>0||
          topicSaving;
      });

      ROUND_DEFS[rk].slots.forEach(def=>{
        const slot=panel.querySelector(
          '[data-slot="'+def.key+'"]'
        );

        const file=(myFiles[rk]||{})[def.key];

        $("[data-file-state]",slot).innerHTML=
          file&&file.url
            ?'<a class="fname" href="'+esc(safeUrl(file.url))+
              '" target="_blank" rel="noopener">'+
              esc(file.name||"檔案")+'</a>'
            :'<span class="fnone">'+
              (def.required?"尚未上傳":"（未上傳）")+
              '</span>';

        $("[data-act=view]",slot).classList.toggle(
          "hidden",
          !(file&&file.url)
        );

        $("[data-pick-label]",slot).textContent=
          file&&file.url?"重新上傳":"上傳";
      });
    });

    const topic=$("#projectTopic");

    if(topic&&document.activeElement!==topic){
      topic.value=topicDraft===null?myTopic:topicDraft;
    }
  }catch(err){
    if(version===renderVersion){
      showUploadNotice(
        "無法載入上傳設定："+(err.code||err.message),
        false
      );
    }
  }
}

async function saveProjectTopic(){
  const input=$("#projectTopic");

  const topic=(
    input?input.value:(topicDraft===null?myTopic:topicDraft)
  ).trim();

  if(!topic){
    if(input){
      input.focus();
      input.reportValidity();
    }

    throw new Error("請填寫專題題目名稱（不可空白）。");
  }

  const uid=auth.currentUser&&auth.currentUser.uid;

  if(!uid||!hasGroup||myCohort!=="current"){
    throw new Error("請先完成分組登錄。");
  }

  const settings=await db.doc("settings/uploads").get({
    source:"server"
  });

  const up=settings.exists?settings.data():{};

  if(
    !up.round1Open||
    !afterStart(up.round1Start)||
    !notPast(up.round1Deadline)
  ){
    throw new Error(
      "第一階段上傳尚未開放或已截止，無法修改題目。"
    );
  }

  const groupDoc=await db.doc("groups/"+uid).get({
    source:"server"
  });

  if(!groupDoc.exists){
    throw new Error("找不到分組資料，請先完成分組登錄。");
  }

  if(groupDoc.data().cohort==="next"){
    throw new Error("下屆組別尚未開放本屆上傳。");
  }

  if(String(groupDoc.data().topic||"").trim()!==topic){
    await db.doc("groups/"+uid).update({topic});
  }

  myTopic=topic;

  if(topicDraft===null||topicDraft.trim()===topic){
    topicDraft=null;
  }

  return topic;
}

$("#roundHost").addEventListener("input",e=>{
  if(e.target.id==="projectTopic"){
    topicDraft=e.target.value;
  }
});

$("#roundHost").addEventListener("click",async e=>{
  const btn=e.target.closest('[data-act="save-topic"]');
  if(!btn||topicSaving)return;

  topicSaving=true;
  btn.disabled=true;

  let saved=false;

  try{
    await saveProjectTopic();
    saved=true;
  }catch(err){
    if($("#topicMsg")){
      flash("topicMsg",err.message||"儲存失敗。",false);
    }
  }finally{
    topicSaving=false;

    if(saved){
      await renderRound();

      if($("#topicMsg")){
        flash("topicMsg","題目已儲存。");
      }
    }else{
      await renderRound();
    }
  }
});

function extOf(name){
  const match=String(name||"").toLowerCase().match(/\.[a-z0-9]+$/);
  return match?match[0]:"";
}

function safeAscii(s){
  return String(s||"")
    .replace(/[^\x20-\x7E]/g,"_")
    .replace(/["\\\/]/g,"_")
    .trim()||"file";
}

function friendlyName(rk,sk,ext){
  const label={
    report:"報告",
    slides:"簡報",
    extra:"補充資料"
  }[sk]||sk;

  const idPart=myGroupNo||myLeaderSid||"未編號";
  const namePart=myLeaderName?("_"+myLeaderName):"";

  return idPart+namePart+"_"+
    (ROUND_LABEL[rk]||rk)+"_"+label+ext;
}

function uploadError(err,step){
  const code=err.code||"";

  if(
    code==="permission-denied"||
    code==="storage/unauthorized"
  ){
    return step+"失敗（"+code+
      "）：帳號沒有此操作權限，請洽系辦確認。";
  }

  if(
    code==="storage/retry-limit-exceeded"||
    code==="unavailable"
  ){
    return step+"失敗：網路連線中斷或逾時，請重新上傳。";
  }

  return step+"失敗："+(
    code||err.message||"未知錯誤"
  );
}

async function validateUpload(rk,uid){
  const doc=await db.doc("settings/uploads").get({
    source:"server"
  });

  const up=doc.exists?doc.data():{};
  const n=rk.slice(1);

  if(
    !up["round"+n+"Open"]||
    !afterStart(up["round"+n+"Start"])||
    !notPast(up["round"+n+"Deadline"])
  ){
    throw new Error("本次上傳尚未開放或已截止。");
  }

  const groupDoc=await db.doc("groups/"+uid).get({
    source:"server"
  });

  if(
    !groupDoc.exists||
    groupDoc.data().cohort==="next"
  ){
    throw new Error("本組尚未開放本屆上傳。");
  }

  if(rk==="r2"){
    const finalistsDoc=await db.doc("settings/finalists").get({
      source:"server"
    });

    const finalists=finalistsDoc.exists
      ?finalistsDoc.data()
      :{};

    const groupNo=groupDoc.data().groupNo;

    if(
      !groupNo||
      !finalists.published||
      !Array.isArray(finalists.groups)||
      !finalists.groups.some(group=>group.no===groupNo)
    ){
      throw new Error("第二次上傳僅開放入選組別。");
    }
  }
}

$("#roundHost").addEventListener("change",async e=>{
  const input=e.target.closest(
    'input[type=file][data-act=pick]'
  );

  if(!input)return;

  const file=input.files&&input.files[0];
  if(!file)return;

  const slot=input.closest(".slot");
  const rk=slot.dataset.round;
  const sk=slot.dataset.slot;

  const def=ROUND_DEFS[rk].slots.find(
    item=>item.key===sk
  );

  const progress=$(".prog",slot);

  const showError=message=>{
    progress.style.color="var(--danger)";
    progress.textContent=message;
    showUploadNotice(message,false);
  };

  if(studentUploads||topicSaving){
    input.value="";
    showError("請等待目前的操作完成後再上傳。");
    return;
  }

  if(!def.accept.split(",").includes(extOf(file.name))){
    input.value="";
    showError("檔案格式須為 "+def.accept);
    return;
  }

  if(file.size>=50*1024*1024){
    input.value="";
    showError("單檔須小於 50MB。");
    return;
  }

  const uid=auth.currentUser?.uid;

  if(!uid){
    input.value="";
    showError("登入已失效，請重新登入。");
    return;
  }

  studentUploads++;
  setUploadBusy(true);

  let step="確認上傳時段";
  let reference=null;
  let recorded=false;
  let message="";

  try{
    showUploadNotice("正在確認上傳資料…");
    progress.style.color="var(--accent)";
    progress.textContent="準備上傳…";

    await validateUpload(rk,uid);

    if(rk==="r1"){
      step="儲存專題題目";
      await saveProjectTopic();
    }

    let space=null;

    try{
      space=await db.doc("settings/storage").get({
        source:"server"
      });
    }catch(_){}

    if(space?.exists){
      const data=space.data();

      if(
        Number(data.capBytes)>0&&
        (Number(data.bytes)||0)+file.size>Number(data.capBytes)
      ){
        throw new Error(
          "系統儲存空間已達上限，請洽系辦處理。"
        );
      }
    }

    const extension=extOf(file.name);

    const path=
      "groups/"+uid+"/"+rk+"/"+sk+"_"+
      Date.now()+"_"+
      Math.random().toString(36).slice(2,8)+
      extension;

    const downloadName=friendlyName(rk,sk,extension);
    const oldFile=(myFiles[rk]||{})[sk];

    reference=storage.ref(path);
    step="上傳檔案";

    const task=reference.put(file,{
      contentType:file.type||"application/octet-stream",
      contentDisposition:
        "inline; filename=\""+safeAscii(downloadName)+
        "\"; filename*=UTF-8''"+
        encodeURIComponent(downloadName)
    });

    task.on("state_changed",snapshot=>{
      const percent=snapshot.totalBytes
        ?Math.round(
          snapshot.bytesTransferred/
          snapshot.totalBytes*100
        )
        :0;

      progress.textContent="上傳中… "+percent+"%";

      showUploadNotice(
        "正在上傳「"+file.name+"」："+percent+"%"
      );
    });

    await task;

    const url=await reference.getDownloadURL();

    step="儲存上傳紀錄";

    const metadata={
      name:file.name,
      dlName:downloadName,
      path:path,
      url:url,
      size:file.size,
      at:Date.now()
    };

    /*
      只更新本次檔案欄位，
      保留同一輪其他已上傳的報告、簡報及補充資料。
    */
    await db.doc("groupFiles/"+uid).set({
      [rk]:{
        [sk]:metadata
      }
    },{merge:true});

    recorded=true;

    myFiles[rk]={
      ...(myFiles[rk]||{}),
      [sk]:metadata
    };

    let removedOld=false;

    if(oldFile?.path&&oldFile.path!==path){
      try{
        await storage.ref(oldFile.path).delete();
        removedOld=true;
      }catch(_){}
    }

    try{
      await db.doc("settings/storage").set({
        bytes:firebase.firestore.FieldValue.increment(
          file.size-
          (removedOld?(Number(oldFile.size)||0):0)
        ),
        at:firebase.firestore.FieldValue.serverTimestamp()
      },{merge:true});
    }catch(_){}

    message="「"+file.name+"」已上傳成功。";
    progress.textContent="已上傳 ✓";
  }catch(err){
    /*
      上傳紀錄寫入失敗時清除本次新檔，
      原本已存在的檔案保留。
    */
    if(reference&&!recorded){
      try{
        await reference.delete();
      }catch(_){}
    }

    message=uploadError(err,step);
    showError(message);
  }finally{
    input.value="";
    studentUploads=Math.max(0,studentUploads-1);

    await renderRound();
    setUploadBusy(false);

    showUploadNotice(message,recorded);
  }
});
</script>

<div id="__np"></div>
<div id="__toast">
  <span class="s"></span>
  <span>處理中…</span>
</div>

<script>
(function(){
  var bar=document.getElementById("__np");
  var toast=document.getElementById("__toast");
  var pending=0;
  var lastBtn=null;
  var fallback=null;
  var toastTimer=null;

  function npStart(){
    if(bar){
      bar.classList.add("on");
      bar.style.width="0";

      requestAnimationFrame(function(){
        bar.style.width="88%";
      });
    }
  }

  function npDone(){
    if(bar){
      bar.style.width="100%";

      setTimeout(function(){
        bar.classList.remove("on");
        bar.style.width="0";
      },260);
    }
  }

  function setBtn(button,on){
    if(!button)return;

    if(on){
      if(button.__loading)return;

      button.__loading=true;
      button.classList.add("btn-loading");
      button.setAttribute("aria-busy","true");
    }else if(button.__loading){
      button.__loading=false;
      button.classList.remove("btn-loading");
      button.removeAttribute("aria-busy");
    }
  }

  function toastOn(on){
    clearTimeout(toastTimer);

    if(on){
      if(toast)toast.classList.add("on");
    }else{
      toastTimer=setTimeout(function(){
        if(toast)toast.classList.remove("on");
        setBtn(lastBtn,false);
      },180);
    }
  }

  function begin(){
    npStart();
    toastOn(true);
  }

  function end(){
    npDone();
    toastOn(false);
  }

  document.addEventListener("click",function(e){
    var button=e.target.closest("button.btn,a.btn");
    if(!button||button.disabled)return;

    lastBtn=button;
    setBtn(button,true);
    begin();

    clearTimeout(fallback);

    fallback=setTimeout(function(){
      if(pending===0)end();
    },600);
  },true);

  function increment(){
    if(pending===0){
      clearTimeout(fallback);
      begin();
    }

    pending++;
  }

  function decrement(){
    pending=Math.max(0,pending-1);
    if(pending===0)end();
  }

  function wrap(prototype,name){
    if(!prototype)return;

    var original=prototype[name];

    if(typeof original!=="function"||original.__wrapped)return;

    prototype[name]=function(){
      var result=original.apply(this,arguments);

      if(result&&typeof result.then==="function"){
        increment();
        result.then(decrement,decrement);
      }

      return result;
    };

    prototype[name].__wrapped=true;
  }

  try{
    if(window.firebase&&firebase.firestore){
      var F=firebase.firestore;

      wrap(F.DocumentReference&&F.DocumentReference.prototype,"set");
      wrap(F.DocumentReference&&F.DocumentReference.prototype,"update");
      wrap(F.DocumentReference&&F.DocumentReference.prototype,"delete");
      wrap(F.WriteBatch&&F.WriteBatch.prototype,"commit");
      wrap(F.CollectionReference&&F.CollectionReference.prototype,"add");
    }
  }catch(_){}
})();
</script>

<button id="toTop" title="回到頂端" aria-label="回到頂端">↑</button>

<script>
(function(){
  var button=document.getElementById("toTop");
  if(!button)return;

  function update(){
    button.classList.toggle("show",window.scrollY>320);
  }

  window.addEventListener("scroll",update,{passive:true});
  update();

  button.addEventListener("click",function(){
    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  });
})();
</script>
