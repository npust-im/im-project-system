<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校外委員入口 · 實務專題系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F5;--surface:#FFFFFF;--ink:#10222E;--muted:#5E6E79;--line:#D5DEE4;--primary:#15455E;--accent:#2E8B84;--gold:#C9822E;--danger:#B4453A;--primary-soft:#E4ECF0;--accent-soft:#E1F0EE;--radius:12px;--shadow:0 1px 2px rgba(16,34,46,.05),0 8px 24px rgba(16,34,46,.06)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:860px;margin:0 auto;padding:0 24px}
.topbar{background:var(--primary);color:#fff;padding:14px 0}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .t{font-family:"Noto Serif TC",serif;font-weight:700;font-size:17px}
.topbar .r{display:flex;align-items:center;gap:14px;font-size:13px}
.topbar a{color:#cfe0e8;text-decoration:none}.topbar a:hover{color:#fff}
.link-btn{background:none;border:0;color:#cfe0e8;font:inherit;cursor:pointer;padding:0}.link-btn:hover{color:#fff}
.center{min-height:74vh;display:grid;place-items:center;padding:40px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:400px;padding:28px}
.card h1{font-family:"Noto Serif TC",serif;font-size:22px;margin:0 0 4px}.card .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:12px 0 5px}
input[type=text],input[type=email],input[type=password],input[type=number]{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;transition:.15s}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input:disabled{background:#f2f5f7;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:9px;font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:.15s;text-decoration:none}
.btn:hover{border-color:var(--primary)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn-primary:hover{background:#0e364a}
.btn-block{width:100%;margin-top:18px}.btn-sm{padding:7px 13px;font-size:13px}
.msg{font-size:13px;margin-top:10px;min-height:18px}.msg.err{color:var(--danger)}.msg.ok{color:var(--accent)}
.hidden{display:none!important}
main{padding:24px 0 60px}
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tab{padding:10px 16px;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.stage-hint{color:var(--muted);font-size:14px;margin:0 0 14px}
.filebar{margin:0 0 16px}
.notice{background:#f7ece0;color:#8a5a1c;border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.grow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.grow .gno{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--primary);font-weight:500;min-width:70px}
.grow .gtitle{font-weight:500;flex:1;min-width:150px}
.grow .gscore{display:flex;align-items:center;gap:8px}
.grow .gscore input{width:92px}
.grow .unit{color:var(--muted);font-size:13px}
.grow .rmsg{font-size:12px;min-width:60px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--muted);font-size:15px}

/* 各組檔案連結 */
.grow .gfiles{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px}
.grow .gfiles a{color:var(--primary);text-decoration:underline}
.grow .gfiles .nofile{color:var(--muted)}

/* 個人資料 */
.docpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.doch{font-family:"Noto Serif TC",serif;font-size:16px;margin:0 0 8px}
.doc-slot{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.doc-slot:first-of-type{border-top:0}
.doc-label{font-size:14px;font-weight:500}
.doc-state .fname{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--primary);word-break:break-all}
.doc-state .nofile{color:var(--muted);font-size:13px}
.doc-state .prog{font-size:12px;margin-left:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.paytype{display:flex;gap:22px}
.paytype .radio{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:500;cursor:pointer}
.paytype .radio input{width:auto}
@media (max-width:640px){.doc-slot{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="topbar"><div class="wrap"><span class="t">校外委員入口</span><div class="r" id="topRight"><a href="index.html">回首頁</a></div></div></div>

<div id="bootView" class="center"><div class="card" style="text-align:center;color:var(--muted)">載入中…</div></div>

<div id="loginView" class="center hidden">
  <div class="card"><h1>校外委員登入</h1><p class="sub">請以系辦提供的委員帳號登入。</p>
  <label for="email">電子郵件</label><input id="email" type="email" autocomplete="username">
  <label for="pw">密碼</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn btn-primary btn-block" id="loginBtn">登入</button><div style="text-align:right;margin-top:8px"><a href="#" id="forgotPw" style="font-size:13px;color:var(--primary)">忘記密碼？</a></div><div class="msg err" id="loginMsg"></div></div>
</div>
<div id="denyView" class="center hidden">
  <div class="card"><h1>無校外委員權限</h1><p class="sub">此帳號非校外委員帳號。如有疑問請洽系辦。</p>
  <button class="btn btn-block" id="denySignOut">登出</button></div>
</div>

<main id="cmView" class="wrap hidden">
  <div class="tabs">
    <div class="tab on" id="tab1">第一階段（書面）</div>
    <div class="tab" id="tab2">第二階段（口頭）</div>
    <div class="tab" id="tab3">個人資料（匯款用）</div>
  </div>
  <div id="scoreArea">
    <p class="stage-hint" id="stageHint"></p>
    <div id="notice"></div>
    <div id="listHost"></div>
  </div>
  <div id="docsArea" class="hidden"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=(s,el=document)=>el.querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
if(typeof firebase==="undefined"||!firebase.apps.length){ $("#loginMsg").textContent="尚未設定 Firebase（請先填好 firebase-config.js）。"; $("#bootView").classList.add("hidden"); $("#loginView").classList.remove("hidden"); }
const auth=firebase.auth(), db=firebase.firestore(), storage=firebase.storage();

let MY_UID=null, stage=1, view="s1";
let allGroups=[], finalists={published:false,groups:[]}, myScores={}, scoring={};
let gfilesMap={}, myDocs={};
const SLOT_LABEL={report:"報告",slides:"簡報",extra:"補充資料"};

function show(v){["bootView","loginView","denyView","cmView"].forEach(x=>$("#"+x).classList.toggle("hidden",x!==v));}
function stageOpen(){ return scoring["c"+stage+"open"]!==false; }

auth.onAuthStateChanged(async user=>{
  if(!user){ $("#topRight").innerHTML='<a href="index.html">回首頁</a>'; show("loginView"); return; }
  try{
    const u=await db.doc("users/"+user.uid).get();
    if(u.exists && u.data().role==="committee"){
      MY_UID=user.uid;
      $("#topRight").innerHTML='<a href="index.html">回首頁</a><button class="link-btn" id="signOut">登出（'+esc(user.email)+'）</button>';
      $("#signOut").onclick=()=>auth.signOut();
      show("cmView"); await loadData(); render(); subscribeLive();
    }else{ show("denyView"); }
  }catch(e){ show("denyView"); }
});
$("#loginBtn").onclick=()=>{const em=$("#email").value.trim(),pw=$("#pw").value;if(!em||!pw){$("#loginMsg").textContent="請輸入電子郵件與密碼。";return;}const btn=$("#loginBtn");btn.disabled=true;btn.textContent="登入中…";auth.signInWithEmailAndPassword(em,pw).catch(e=>$("#loginMsg").textContent="登入失敗："+(e.code||e.message)).finally(()=>{btn.disabled=false;btn.textContent="登入";});};
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("#loginBtn").click();});
$("#forgotPw").onclick=(e)=>{
  e.preventDefault();
  const el=$("#loginMsg"); const set=(m,ok)=>{el.className="msg "+(ok?"ok":"err");el.textContent=m;};
  const em=$("#email").value.trim();
  if(!em){ set("請先在上方輸入電子郵件。",false); return; }
  set("寄送中…",true);
  auth.sendPasswordResetEmail(em).then(()=>set("重設信已寄出（僅當此信箱為系統登記帳號時才會寄達）。請檢查收件匣與垃圾郵件匣；1–2 分鐘未收到，請確認信箱是否正確或洽系辦。",true)).catch(err=>{const c=err.code||"";set(c==="auth/user-not-found"?"此信箱尚未註冊為系統帳號，請確認或洽系辦。":c==="auth/invalid-email"?"電子郵件格式不正確。":c==="auth/too-many-requests"?"嘗試過於頻繁，請稍後再試。":c==="auth/missing-email"?"請輸入電子郵件。":"寄送失敗："+(c||err.message),false);});
};
$("#denySignOut").onclick=()=>auth.signOut();
function setTab(which){
  view=which;
  $("#tab1").classList.toggle("on",which==="s1");
  $("#tab2").classList.toggle("on",which==="s2");
  $("#tab3").classList.toggle("on",which==="docs");
  const isDocs=which==="docs";
  $("#scoreArea").classList.toggle("hidden",isDocs);
  $("#docsArea").classList.toggle("hidden",!isDocs);
}
$("#tab1").onclick=()=>{stage=1;setTab("s1");render();};
$("#tab2").onclick=()=>{stage=2;setTab("s2");render();};
$("#tab3").onclick=()=>{setTab("docs");renderDocs();};
function reRender(){
  if(view==="docs"){ return; }
  const keep={};
  document.querySelectorAll("#listHost .grow").forEach(r=>{ const i=r.querySelector("input"); if(i&&i.value!=="") keep[r.dataset.id]=i.value; });
  render();
  Object.keys(keep).forEach(gid=>{ const i=document.querySelector('#listHost .grow[data-id="'+gid+'"] input'); if(i) i.value=keep[gid]; });
}
function applyScoringState(){
  const open=stageOpen();
  $("#notice").innerHTML = open ? '' : '<div class="notice">本階段評分目前未開放，僅供檢視。開放後即可儲存。</div>';
  document.querySelectorAll("#listHost .grow input, #listHost [data-act=save]").forEach(el=>el.disabled=!open);
}
function fileLinks(gid,rk){
  const rec=(gfilesMap[gid]||{})[rk]||{};
  const order = rk==="r1" ? ["report","slides","extra"] : ["slides"];
  const items=order.map(sk=>{ const f=rec[sk]; if(!f||!f.url) return "";
    return '<a href="'+esc(f.url)+'" target="_blank" rel="noopener">'+esc(SLOT_LABEL[sk]||sk)+'</a>'; }).filter(Boolean);
  return items.length ? items.join("") : '<span class="nofile">未上傳</span>';
}
function subscribeLive(){
  if(subscribeLive.done)return; subscribeLive.done=true;
  db.doc("settings/scoring").onSnapshot(d=>{ scoring=d.exists?d.data():{}; applyScoringState(); },()=>{});
  db.doc("settings/finalists").onSnapshot(d=>{ finalists=d.exists?d.data():{published:false,groups:[]}; reRender(); },()=>{});
  db.collection("groups").onSnapshot(s=>{ allGroups=s.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>String(a.groupNo||"").localeCompare(String(b.groupNo||""))); reRender(); },()=>{});
  db.collection("groupFiles").onSnapshot(s=>{ gfilesMap={}; s.docs.forEach(x=>gfilesMap[x.id]=x.data()); reRender(); },()=>{});
}

async function loadData(){
  const [gs,fin,sc,scr,gf,docs]=await Promise.all([
    db.collection("groups").get(),
    db.doc("settings/finalists").get(),
    db.collection("committeeScores").where("committeeUid","==",MY_UID).get(),
    db.doc("settings/scoring").get(),
    db.collection("groupFiles").get(),
    db.doc("committeeDocs/"+MY_UID).get()
  ]);
  allGroups=gs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.groupNo||"").localeCompare(String(b.groupNo||"")));
  finalists=fin.exists?fin.data():{published:false,groups:[]};
  myScores={}; sc.docs.forEach(d=>{const s=d.data();myScores[s.stage+"__"+s.gid]=s.score;});
  scoring=scr.exists?scr.data():{};
  gfilesMap={}; gf.docs.forEach(d=>gfilesMap[d.id]=d.data());
  myDocs=docs.exists?docs.data():{};
}
function groupsForStage(){
  if(stage===1) return allGroups;
  if(!finalists.published) return [];
  const nos=(finalists.groups||[]).map(g=>g.no);
  return allGroups.filter(g=>g.groupNo && nos.includes(g.groupNo));
}
function render(){
  if(view==="docs") return;
  const open=stageOpen();
  $("#notice").innerHTML = open ? '' : '<div class="notice">本階段評分目前未開放，僅供檢視。開放後即可儲存。</div>';
  const list=groupsForStage();
  const done=list.filter(g=>{const v=myScores[stage+"__"+g.id];return v===0||v;}).length;
  const base = stage===1
    ? "請點各組檔案連結審閱後，評定第一階段書面成績（0–100），每組可分別儲存。"
    : (finalists.published ? "請為入選第二階段之組別評定口頭發表成績（0–100），每組可分別儲存。" : "第二階段入選名單尚未公布。");
  $("#stageHint").textContent = base + (list.length ? "（已完成 "+done+"／"+list.length+" 組）" : "");
  const host=$("#listHost");
  if(!list.length){ host.innerHTML='<div class="empty">'+(stage===2&&!finalists.published?"入選名單公布後即可評分。":"目前沒有可評分的組別。")+'</div>'; return; }
  const rk = stage===1 ? "r1" : "r2";
  host.innerHTML=list.map(g=>{
    const val=myScores[stage+"__"+g.id]; const v=(val===0||val)?val:"";
    return '<div class="grow" data-id="'+esc(g.id)+'">'+
      '<span class="gno mono">'+esc(g.groupNo||"未編號")+'</span>'+
      '<span class="gtitle">'+esc(g.topic||"（未填題目）")+'</span>'+
      '<span class="gfiles">'+fileLinks(g.id,rk)+'</span>'+
      '<span class="gscore"><input type="number" min="0" max="100" value="'+v+'" placeholder="0–100" '+(open?"":"disabled")+'><span class="unit">分</span></span>'+
      '<button class="btn btn-primary btn-sm" data-act="save" '+(open?"":"disabled")+'>儲存</button>'+
      '<span class="rmsg msg" data-msg></span></div>';
  }).join("");
}

/* ===== 個人資料（匯款用） ===== */
function renderDocs(){
  const d=myDocs||{};
  const pb=d.passbook;
  const pbState = pb&&pb.url?'<a class="fname" href="'+esc(pb.url)+'" target="_blank" rel="noopener">'+esc(pb.name||"檔案")+'</a>':'<span class="nofile">尚未上傳</span>';
  const pay=d.payType||"post";
  $("#docsArea").innerHTML=
    '<div class="notice" style="background:#eef1f3;color:var(--muted)">此頁資料僅供系辦作業（例如評審費匯款）使用，只有您本人與系辦看得到；其他委員無法看到。存簿封面：單檔上限 50MB，格式 JPG／PNG／PDF。</div>'+
    '<div class="docpanel"><h3 class="doch">身分與戶籍</h3>'+
      '<label>身分證字號</label><input type="text" id="dId" value="'+esc(d.idNumber||"")+'" placeholder="請輸入身分證字號">'+
      '<label style="margin-top:10px">戶籍地址</label><input type="text" id="dAddr" value="'+esc(d.householdAddr||"")+'" placeholder="請填寫戶籍地址">'+
    '</div>'+
    '<div class="docpanel"><h3 class="doch">匯款帳戶</h3>'+
      '<p style="font-size:13px;color:var(--muted);margin:0 0 10px">郵局與銀行二擇一。</p>'+
      '<div class="paytype">'+
        '<label class="radio"><input type="radio" name="payType" value="post"'+(pay==="post"?" checked":"")+'> 郵局</label>'+
        '<label class="radio"><input type="radio" name="payType" value="bank"'+(pay==="bank"?" checked":"")+'> 銀行</label>'+
      '</div>'+
      '<div id="postFields" class="'+(pay==="post"?"":"hidden")+'" style="margin-top:12px">'+
        '<label>郵局帳號</label><input type="text" id="dPost" value="'+esc(d.postAccount||"")+'" placeholder="局號＋帳號">'+
      '</div>'+
      '<div id="bankFields" class="'+(pay==="bank"?"":"hidden")+'" style="margin-top:12px">'+
        '<div class="grid3">'+
          '<div><label>銀行代碼</label><input type="text" id="dBankCode" value="'+esc(d.bankCode||"")+'" placeholder="例：822"></div>'+
          '<div><label>分行</label><input type="text" id="dBranch" value="'+esc(d.bankBranch||"")+'" placeholder="分行名稱"></div>'+
          '<div><label>帳號</label><input type="text" id="dAcct" value="'+esc(d.bankAccount||"")+'" placeholder="銀行帳號"></div>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="docpanel"><h3 class="doch">存簿封面</h3>'+
      '<div class="doc-slot"><div class="doc-label">存簿封面</div>'+
        '<div class="doc-state" data-doc-state="passbook">'+pbState+'<span class="prog" style="display:none"></span></div>'+
        '<label class="btn btn-sm"><input type="file" accept=".jpg,.jpeg,.png,.pdf" data-doc="passbook" style="display:none">'+(pb&&pb.url?"重新上傳":"上傳")+'</label></div>'+
    '</div>'+
    '<div style="margin-top:4px"><button class="btn btn-primary" id="saveDocs">儲存資料</button><span class="msg ok" id="docsMsg" style="margin-left:10px"></span></div>';
}
function extOf(name){ const m=String(name||"").toLowerCase().match(/\.[a-z0-9]+$/); return m?m[0]:""; }
$("#docsArea").addEventListener("change",async e=>{
  const radio=e.target.closest('input[name="payType"]');
  if(radio){ const isPost=radio.value==="post"; $("#postFields").classList.toggle("hidden",!isPost); $("#bankFields").classList.toggle("hidden",isPost); return; }
  const inp=e.target.closest('input[type=file][data-doc]'); if(!inp)return;
  const file=inp.files&&inp.files[0]; if(!file)return;
  const key=inp.dataset.doc;
  const stateEl=$('[data-doc-state="'+key+'"]'); const prog=stateEl.querySelector(".prog");
  const showErr=m=>{ prog.style.display=""; prog.style.color="var(--danger)"; prog.textContent=m; };
  const ext=extOf(file.name);
  if(![".jpg",".jpeg",".png",".pdf"].includes(ext)){ showErr("格式須為 JPG／PNG／PDF。"); inp.value=""; return; }
  if(file.size>=50*1024*1024){ showErr("檔案超過 50MB。"); inp.value=""; return; }
  const path="committee/"+MY_UID+"/"+key+"_"+Date.now()+ext;
  prog.style.display=""; prog.style.color="var(--accent)"; prog.textContent="上傳中… 0%";
  try{
    const ref=storage.ref(path);
    const task=ref.put(file,{contentType:file.type||"application/octet-stream"});
    task.on("state_changed",s=>{ prog.textContent="上傳中… "+Math.round(s.bytesTransferred/s.totalBytes*100)+"%"; });
    await task;
    const url=await ref.getDownloadURL();
    const old=myDocs[key];
    myDocs[key]={name:file.name,path:path,url:url,size:file.size,at:Date.now()};
    await db.doc("committeeDocs/"+MY_UID).set({[key]:myDocs[key],updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    if(old&&old.path&&old.path!==path){ try{ await storage.ref(old.path).delete(); }catch(_){}}
    prog.textContent="已上傳 ✓";
    setTimeout(renderDocs,700);
  }catch(err){ showErr("上傳失敗："+(err.code||err.message)); }
  finally{ inp.value=""; }
});
$("#docsArea").addEventListener("click",async e=>{
  if(!e.target.closest("#saveDocs"))return;
  const btn=e.target.closest("#saveDocs"); const msg=$("#docsMsg");
  btn.disabled=true;
  try{
    const pay=(document.querySelector('input[name="payType"]:checked')||{}).value||"post";
    const patch={
      idNumber:$("#dId").value.trim(),
      householdAddr:$("#dAddr").value.trim(),
      payType:pay,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    };
    if(pay==="post"){ patch.postAccount=$("#dPost").value.trim(); patch.bankCode=""; patch.bankBranch=""; patch.bankAccount=""; }
    else{ patch.postAccount=""; patch.bankCode=$("#dBankCode").value.trim(); patch.bankBranch=$("#dBranch").value.trim(); patch.bankAccount=$("#dAcct").value.trim(); }
    await db.doc("committeeDocs/"+MY_UID).set(patch,{merge:true});
    Object.assign(myDocs,patch);
    msg.textContent="已儲存。"; msg.className="msg ok"; setTimeout(()=>{msg.textContent="";},2200);
  }catch(err){ msg.textContent="儲存失敗："+(err.code||err.message); msg.className="msg err"; }
  finally{ btn.disabled=false; }
});
$("#listHost").addEventListener("click",async e=>{
  const b=e.target.closest("[data-act=save]"); if(!b)return;
  if(!stageOpen()) return;
  const row=b.closest(".grow"); const gid=row.dataset.id; const msg=$("[data-msg]",row);
  const raw=$("input",row).value.trim();
  if(raw===""){ msg.textContent="請輸入分數。"; msg.className="rmsg msg err"; return; }
  const n=Number(raw);
  if(!Number.isFinite(n)||n<0||n>100){ msg.textContent="0–100"; msg.className="rmsg msg err"; return; }
  b.disabled=true;
  try{
    const id=stage+"__"+gid+"__"+MY_UID;
    await db.doc("committeeScores/"+id).set({gid:gid,committeeUid:MY_UID,stage:stage,score:n,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    myScores[stage+"__"+gid]=n; msg.textContent="已儲存"; msg.className="rmsg msg ok"; setTimeout(()=>{msg.textContent="";},2200);
  }catch(err){ msg.textContent="失敗"; msg.className="rmsg msg err"; }
  finally{ b.disabled=false; }
});
</script>
</body>
</html>
